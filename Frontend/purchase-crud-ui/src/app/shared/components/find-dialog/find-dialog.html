<div class="overlay">

    <div class="dialog">

        <div class="dialog-header">

        <span class="dialog-title">{{ title }}</span>

            <button 
                class="close-button"
                type="button"
                (click)="close()">
                X
            </button>

        </div>


        <div class="dialog-body">

            <!-- Search Row -->

            <div class="search-row">

                <input

                    *ngFor="let col of columnDefs"

                    type="text"

                    class="search-input"

                    [placeholder]="'🔍 Search by ' + col.headerName"

                    [(ngModel)]="searchFilters[col.field!]"

                    (input)="onSearchChanged()">

            </div>

            <!-- Grid -->

            <div class="grid-container ag-theme-alpine lookup-grid">

                <ag-grid-angular

                    style="width:100%; height:500px;"

                    [rowData]="rowData"

                    [columnDefs]="columnDefs"

                    [defaultColDef]="defaultColDef"

                    [pagination]="true"

                    (rowDoubleClicked)="onRowDoubleClick($event)">

                </ag-grid-angular>

            </div>


        </div>

    </div>

</div>
